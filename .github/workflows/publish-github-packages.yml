name: Publish packages to GitHub Packages and npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  packages: write

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 22
  PROJECT_FILE: src/Casko.XmlSitemapsForUmbraco.Package/Casko.XmlSitemapsForUmbraco.Package.csproj
  NPM_PACKAGE_DIR: src/Casko.XmlSitemapsForUmbraco.Package/Client
  NPM_REGISTRY_URL: https://registry.npmjs.org
  PACKAGE_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY_URL }}
          cache: npm
          cache-dependency-path: ${{ env.NPM_PACKAGE_DIR }}/package-lock.json

      - name: Derive and validate package version
        id: versioning
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ github.event.release.tag_name }}"
          TARGET_BRANCH="${{ github.event.release.target_commitish }}"

          echo "Release tag: $TAG"
          echo "Target branch: $TARGET_BRANCH"

          if [[ ! "$TAG" =~ ^v.+ ]]; then
            echo "::error::Release tag must start with 'v'. Got: $TAG"
            exit 1
          fi

          VERSION="${TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Derived version is not valid: $VERSION"
            exit 1
          fi

          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE=true
            NPM_TAG=next
          else
            IS_PRERELEASE=false
            NPM_TAG=latest
          fi

          if [[ "$IS_PRERELEASE" == "false" && "$TARGET_BRANCH" != "main" ]]; then
            echo "::error::Stable releases are only allowed from 'main'. Tag '$TAG' targets '$TARGET_BRANCH'."
            exit 1
          fi

          if [[ "$IS_PRERELEASE" == "true" && "$TARGET_BRANCH" == "main" ]]; then
            echo "::error::Prerelease versions are not allowed from 'main'. Tag '$TAG' targets '$TARGET_BRANCH'."
            exit 1
          fi

          echo "package_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"

          echo "Resolved package version: $VERSION"
          echo "Prerelease: $IS_PRERELEASE"
          echo "npm dist-tag: $NPM_TAG"

      - name: Restore
        run: dotnet restore "${{ env.PROJECT_FILE }}"

      - name: Pack
        run: |
          dotnet pack "${{ env.PROJECT_FILE }}" \
            --configuration Release \
            --no-restore \
            -p:Version=${{ steps.versioning.outputs.package_version }} \
            -o ./artifacts

      - name: Push package to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.NUGET_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          packages=(./artifacts/*.nupkg)
          symbols=(./artifacts/*.snupkg)

          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No .nupkg files were produced."
            exit 1
          fi

          for pkg in "${packages[@]}"; do
            if [[ "$pkg" == *.snupkg ]]; then
              continue
            fi

            echo "Pushing $pkg"
            dotnet nuget push "$pkg" \
              --source "${{ env.PACKAGE_SOURCE }}" \
              --api-key "$GITHUB_TOKEN" \
              --skip-duplicate
          done

          if [ ${#symbols[@]} -gt 0 ]; then
            echo "::notice::Symbol packages were produced but are not being pushed in this workflow."
          fi

      - name: Install npm dependencies
        working-directory: ${{ env.NPM_PACKAGE_DIR }}
        run: npm ci

      - name: Build npm package
        working-directory: ${{ env.NPM_PACKAGE_DIR }}
        run: npm run build

      - name: Prepare npm package metadata
        working-directory: ${{ env.NPM_PACKAGE_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          IS_PRIVATE="$(node -p "require('./package.json').private === true ? 'true' : 'false'")"

          if [[ "$PACKAGE_NAME" != @*/* ]]; then
            echo "::error::npm package name must be scoped to an npm org, for example '@org/package'. Got: $PACKAGE_NAME"
            exit 1
          fi

          if [[ "$IS_PRIVATE" == "true" ]]; then
            echo "::error::npm package is marked private. Remove 'private: true' before publishing to npm."
            exit 1
          fi

          npm version "${{ steps.versioning.outputs.package_version }}" --no-git-tag-version
          npm pack --dry-run

      - name: Publish npm package
        working-directory: ${{ env.NPM_PACKAGE_DIR }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance --tag "${{ steps.versioning.outputs.npm_tag }}"

      - name: Summarize
        run: |
          echo "Published version: ${{ steps.versioning.outputs.package_version }}"
          echo "Prerelease: ${{ steps.versioning.outputs.is_prerelease }}"
          echo "Package source: ${{ env.PACKAGE_SOURCE }}"
          echo "npm registry: ${{ env.NPM_REGISTRY_URL }}"
          echo "npm dist-tag: ${{ steps.versioning.outputs.npm_tag }}"

